---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.rhel10cis_rule_5_3_1_5 }}
file:
  passwd_auth_pam_unix:
    title: 5.3.1.5 | Ensure pam_unix module is enabled
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^\s*auth\s+\S+\s+pam_unix\.so\b/'
    - '/^\s*account\s+\S+\s+pam_unix\.so\b/'
    - '/^\s*password\s+\S+\s+pam_unix\.so\b/'
    - '/^\s*session\s+\S+\s+pam_unix\.so\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.5
      NIST800-53R5: IA-5
  system_auth_pam_unix:
    title: 5.3.1.5 | Ensure pam_unix module is enabled
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^\s*auth\s+\S+\s+pam_unix\.so\b/'
    - '/^\s*account\s+\S+\s+pam_unix\.so\b/'
    - '/^\s*password\s+\S+\s+pam_unix\.so\b/'
    - '/^\s*session\s+\S+\s+pam_unix\.so\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.1.5
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
