---

{{ if .Vars.rhel10cis_level_2 }}
  {{ if .Vars.rhel10cis_rule_5_1_8 }}
file:
  sshd_disable_forward:
    title: 5.1.8 | Ensure sshd DisableForwarding is enabled | config
    path: {{ .Vars.rhel10cis_sshd_config_file }}
    exists: true
    contents:
    - '/^(?i)disableforwarding yes/'
    - '!/^(?i)disableforwarding no/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-7
command:
  ssh_disable_forward_live:
    title: 5.1.8 | Ensure sshd DisableForwarding is enabled | live
    exec: sshd -T | grep -i disableforwarding
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^disableforwarding yes/'
    - '!/(?i)^disableforwarding no/'
    meta:
      server: 2
      workstation: 1
      CIS_ID:
      - 5.1.8
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
