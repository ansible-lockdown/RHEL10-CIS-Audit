---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.rhel10cis_rule_5_1_2 }}
command:
  ssh_host_private_key_access:
    title: 5.1.2 | Ensure access to SSH private host key files is configured
    exec: |
      l_ssh_group=""
      grep -Psiq -- '^\h*ID_LIKE="?([^#\n\r]+)?\bfedora\b' /etc/os-release 2>/dev/null && grep -Psq -- '^ssh_keys\b' /etc/group 2>/dev/null && l_ssh_group="ssh_keys"
      find -L /etc/ssh -xdev -type f 2>/dev/null | while IFS= read -r l_file; do
        grep -Eq -- '^-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' "$l_file" 2>/dev/null || continue
        ssh-keygen -lf "$l_file" >/dev/null 2>&1 || continue
        echo "checked: $l_file"
        stat -Lc '%#a:%U:%G' "$l_file" | while IFS=: read -r l_mode l_owner l_group; do
          if [ "$l_group" = "$l_ssh_group" ]; then l_mask="0137"; else l_mask="0177"; fi
          if [ $(( l_mode & l_mask )) -gt 0 ] || [ "$l_owner" != "root" ] || { [ "$l_group" != "$l_ssh_group" ] && [ "$l_group" != "root" ]; }; then
            echo "FAIL: $l_file mode $l_mode owner $l_owner group $l_group"
          fi
        done
      done
    exit-status: 0
    stdout:
    - '/^checked: /'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
