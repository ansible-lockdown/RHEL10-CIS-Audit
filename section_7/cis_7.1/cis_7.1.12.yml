---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.rhel10cis_rule_7_1_12 }}
command:
  unowned_ungrouped_dirs:
    title: 7.1.12 | Ensure no files or directories without an owner and a group exist
    exec: |
      findmnt -Dkerno fstype,target | awk '($1 !~ /^[[:space:]]*(nfs|proc|cifs|smb|vfat|iso9660|efivarfs|selinuxfs|ncpfs)/ && $2 !~ /^(\/run|\/tmp|\/var\/tmp)(\/|$)/){print $2}' | while IFS= read -r l_mount; do
        find "$l_mount" -xdev {{ .Vars.rhel10cis_exclude_unowned_search_path }} \( -nouser -o -nogroup \) -printf 'FAIL: %u %g %p\n' 2>/dev/null
      done
      echo "scan_done"
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.12
      NIST800-53R5:
      - CM-6
    {{ end }}
  {{ end }}
{{ end }}
