---

{{ if .Vars.rhel10cis_level_2 }}
  {{ if .Vars.run_heavy_tests }}
    {{ if .Vars.rhel10cis_rule_1_2_1_3 }}
command:
  repo_gpgcheck_global:
    title: 1.2.1.3 | Ensure repo_gpgcheck is globally activated
    skip: {{ or (not .Vars.rhel10cis_enable_repogpg) .Vars.rhel10cis_rhel_default_repo }}
    exec: grep -E "^repo_gpgcheck" /etc/dnf/dnf.conf
    timeout: {{ .Vars.timeout_ms }}
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^repo_gpgcheck\s*=\s*1/'
    - '!/^repo_gpgcheck\s*=\s*0/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
      CCI: NA
  repo_gpgcheck_repo:
    title: 1.2.1.3 | Ensure repo_gpgcheck is globally activated
    skip: {{ or (not .Vars.rhel10cis_enable_repogpg) .Vars.rhel10cis_rhel_default_repo }}
    exit-status: 0
    exec: echo "repo_gpgcheck_disabled_repos=$(grep -Pis -- '^\h*repo_gpgcheck\h*=\h*(0|false|no)\b' /etc/yum.repos.d/*.repo | wc -l)"
    stdout:
    - '/^repo_gpgcheck_disabled_repos=0$/'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R5: SI-2
    {{ end }}
  {{ end }}
{{ end }}
