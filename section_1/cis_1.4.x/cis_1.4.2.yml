---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.rhel10cis_rule_1_4_2 }}
file:
  grub_bootloaders_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | file_perms | grub.cfg
    path: /boot/grub2/grub.cfg
    exists: true
    owner: root
    group: root
    mode: "0600"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      NIST800-53R5: CM-6
  grubenv_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | file_perms | grubenv
    path: /boot/grub2/grubenv
    exists: true
    owner: root
    group: root
    mode: "0600"
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      NIST800-53R5: CM-6
command:
  grub_all_files_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | file_perms | all files in /boot/grub2
    exec: find -L /boot/grub2/ -mindepth 1 -maxdepth 1 -type f \( -perm /0177 -o ! -user root -o ! -group root \) -exec stat -Lc '%n %#a %U:%G' {} +
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
