---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.rhel10cis_rule_6_2_1_4 }}
    {{ if and .Vars.rhel10cis_journald_config (not .Vars.rhel10cis_rsyslog_config) }}
service:
  journald_system:
    title: 6.2.1.4 | Ensure only one logging system is in use | journald system
    name: systemd-journald
    running: true
    enabled: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.4
      NIST800-53R5: NA
  not_rsyslog_system:
    title: 6.2.1.4 | Ensure only one logging system is in use | journald system
    name: rsyslog
    running: false
    enabled: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.4
      NIST800-53R5: NA
    {{ end }}
    {{ if and .Vars.rhel10cis_rsyslog_config (not .Vars.rhel10cis_journald_config) }}
service:
  rsyslog_system:
    title: 6.2.1.4 | Ensure only one logging system is in use | rsyslog system
    name: rsyslog
    running: true
    enabled: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.4
      NIST800-53R5: NA
    {{ end }}
  {{ end }}
{{ end }}
