---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.rhel10cis_rule_6_2_4_1 }}
command:
  logfile_configured_login_files:
    title: 6.2.4.1 | Ensure access to all logfiles has been configured
    exec: find /var/log/ -type f -perm /g+x,o+wx {{ if .Vars.rhel10cis_logfile_perms_exclude }}-print | grep -Ev{{ range .Vars.rhel10cis_logfile_perms_exclude }} -e '{{ . }}'{{ end }}{{ else }}-exec ls -l "{}" +{{ end }} | grep -E "[b,u,w]tmp.*|lastlog"
    exit-status:
      or:
      - 0
      - 1
    stdout: ['!/.*/']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-8
  logfile_configured_syslog_logs:
    title: 6.2.4.1 | Ensure access to all logfiles has been configured
    exec: find /var/log/ -type f -perm /g+wx,o+wx {{ if .Vars.rhel10cis_logfile_perms_exclude }}-print | grep -Ev{{ range .Vars.rhel10cis_logfile_perms_exclude }} -e '{{ . }}'{{ end }}{{ else }}-exec ls -l "{}" +{{ end }} | grep -E "auth|secure|syslog|messages|journal|auth"
    exit-status:
      or:
      - 0
      - 1
    stdout: ['!/.*/']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-8
  logfile_configured_sssd:
    title: 6.2.4.1 | Ensure access to all logfiles has been configured
    exec: find /var/log/ -type f -perm /g+x,o+rwx {{ if .Vars.rhel10cis_logfile_perms_exclude }}-print | grep -Ev{{ range .Vars.rhel10cis_logfile_perms_exclude }} -e '{{ . }}'{{ end }}{{ else }}-exec ls -l "{}" +{{ end }} | grep -Ei "ssd|gdm"
    exit-status:
      or:
      - 0
      - 1
    stdout: ['!/.*/']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.4.1
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
