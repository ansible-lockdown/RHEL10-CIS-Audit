---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if .Vars.rhel10cis_rule_6_2_3_8 }}
file:
  /etc/logrotate.conf:
    title: 6.2.3.8 | Ensure rsyslog logrotate is configured
    exists: true
    contents:
    - '/^\s*rotate\s+[0-9]+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.8
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
