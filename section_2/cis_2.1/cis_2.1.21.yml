---

{{ if .Vars.rhel10cis_level_1 }}
  {{ if not .Vars.rhel10cis_is_mail_server }}
    {{ if .Vars.rhel10cis_rule_2_1_21 }}
command:
  mta_listening_port25:
    title: 2.1.21 | Ensure mail transfer agents are configured for local-only mode
    exit-status: 1
    exec: 'ss -lntu | grep -E ":25\s" | grep -E -v "\s(127.0.0.1|\[?::1\]?):25\s"'
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-7
  mta_postfix_loopback_only:
    title: 2.1.21 | Ensure mail transfer agents are configured for local-only mode | postfix inet_interfaces
    exec: 'if command -v postconf >/dev/null 2>&1; then postconf -h inet_interfaces; else echo "postfix not installed"; fi'
    exit-status: 0
    stdout:
    - '/^(loopback-only|postfix not installed)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.21
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
